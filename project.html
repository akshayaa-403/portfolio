<!-- Static host (GitHub Pages) serves no custom headers, so the policy ships
     in-document. style-src keeps 'unsafe-inline': the hero's prop coordinates
     live in style attributes, and dropping it would collapse the whole stage.
     script-src keeps it for the no-FOUC snippet that must run before paint.
     frame-ancestors is omitted: browsers ignore it in a <meta> CSP and warn,
     and GitHub Pages cannot send it as a header.
     frame-src lists exactly the origins the live-demo embeds load; without it
     they inherit default-src 'self' and every embed is blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src https://arteza.site https://akshayaa-403.github.io https://quantamental-screener.streamlit.app; base-uri 'none'; form-action 'none'; object-src 'none'">

<!-- No-FOUC: mark JS available and apply the saved view mode + theme before
     first paint. Must stay in sync with js/theme.js. -->
<script>
(function () {
  var r = document.documentElement;
  r.classList.add('js');
  var m = 'chaos';
  try {
    var s = localStorage.getItem('viewMode');
    if (s === 'notebook' || s === 'clean' || s === 'chaos') m = s;
  } catch (e) {}
  r.setAttribute('data-mode', m);

  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia &&
         window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  if (t === 'dark') r.setAttribute('data-theme', 'dark');
})();
</script>
